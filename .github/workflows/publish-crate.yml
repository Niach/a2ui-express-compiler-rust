# Publishes the a2ui-express crate to crates.io when a tag
# `a2ui-express-v<version>` is pushed (or by hand). The tag's version must
# match the workspace version in Cargo.toml.
#
# Needs the `CARGO_REGISTRY_TOKEN` repository secret: a crates.io API token
# of an owner of the crate (for the first publish, of whoever will own it).
# Without it the job fails before anything is published.
name: publish-crate

on:
  push:
    tags: ["a2ui-express-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "cargo publish --dry-run (uncheck to publish for real)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="a2ui-express"))')
          test "${GITHUB_REF_NAME}" = "a2ui-express-v${version}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: cargo test -p a2ui-express
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run -p a2ui-express
          else
            test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::CARGO_REGISTRY_TOKEN secret is not set"; exit 1; }
            cargo publish -p a2ui-express
          fi
