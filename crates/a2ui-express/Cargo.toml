[package]
name = "a2ui-express"
description = "A2UI Express compiler: parse, compile, stream and decompile the Express inference format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/a2ui-express"
keywords = ["a2ui", "genui", "llm", "compiler", "ui"]
categories = ["compilers", "parser-implementations", "wasm"]
include = ["src/**/*", "schemas/**/*", "Cargo.toml", "LICENSE", "NOTICE"]

# Runtime dependencies stay limited to serde_json and thiserror so the
# crate embeds cleanly in eui-core and builds for wasm32-unknown-unknown.
[dependencies]
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_yaml_ng.workspace = true
regex.workspace = true

# The upstream conformance suite. A custom harness, so it can print the
# per-suite pass counts and check conformance/known_failures.txt.
[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = false
